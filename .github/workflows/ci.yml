name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Check committed declaration snapshot
        run: |
          git diff --exit-code -- types
          test -z "$(git ls-files --others --exclude-standard -- types)"
      - run: node scripts/node-smoke.mjs
      - run: bun pm pack --dry-run --ignore-scripts
